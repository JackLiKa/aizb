<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>等待主程序 · 大肥鱼直播</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(1200px 700px at 50% 15%, #12233a 0%, #0b1220 55%, #070d18 100%);
      color: #e6edf7; font: 15px/1.6 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }
    .card {
      width: min(560px, 88vw); padding: 36px 40px; border-radius: 18px;
      background: rgba(16, 27, 44, .82); border: 1px solid rgba(120, 170, 235, .18);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .45); text-align: center;
    }
    .dot {
      width: 46px; height: 46px; margin: 0 auto 18px; border-radius: 50%;
      border: 3px solid rgba(120, 170, 235, .25); border-top-color: #6ea8ff;
      animation: spin 1.1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { margin: 0 0 10px; font-size: 20px; font-weight: 600; letter-spacing: .5px; }
    p { margin: 0 0 8px; color: #a8b8cf; }
    code {
      display: inline-block; margin-top: 12px; padding: 8px 14px; border-radius: 10px;
      background: rgba(110, 168, 255, .1); color: #9cc4ff; font-size: 13px;
    }
    .hint { margin-top: 20px; font-size: 13px; color: #7d8ca3; }
  </style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>正在等待主程序</h1>
    <p>看板数据由「大肥鱼直播」主程序提供，请先启动主程序。</p>
    <p>连上后本窗口会自动进入，无需手动刷新。</p>
    <code id="addr">http://127.0.0.1:17890</code>
    <div class="hint">每 2 秒自动重试一次</div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const base = params.get('base') || 'http://127.0.0.1:17890';
    const page = params.get('page') === 'admin' ? '/admin/' : '/dashboard/';
    document.getElementById('addr').textContent = base + page;
  </script>
</body>
</html>
